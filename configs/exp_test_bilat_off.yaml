# configs/exp_forward_facing.yaml
experiment:
  name: exp_test_bilat_off
  notes:

eval_iggt:
  seed: 33
  n_skip: 40

  #inpaint method
  inpaint_method: "sd"

  # Pull harvest geometry (與舊 best 相同)
  src_dilation_px: 11
  tgt_dilation_px: 5

  # Photometric — 還原舊 best 的 3.0（現在的 2.5 太嚴格）
  phot_z_thresh: 3.0
  phot_ring_px: 20
  local_bg_radius: 20
  local_bg_extra_dil: 10        # 從 30 降回（forward-facing 不需要推那麼遠）

  # Spatial coherence — 放寬
  min_trusted_blob: 300         # 從 1000 降（保留更多真實 pull）
  bilateral_d: 0                # 從 15 降（少平滑）
  bilateral_sigma: 15.0         # 從 30 降

  # Shadow detection — forward-facing 幾乎關閉
  shadow_search_px: 100
  shadow_thresh_k: 100.0        # 極高 → 幾乎不觸發
  min_shadow_blob: 100000       # 極高 → 幾乎不觸發
  bright_untrust_k: 100.0       # 極高 → M2 等同關閉

train:
  seed: 33
  total_iters: 20000
  dead_weight: 1.0
  patch_size: 256
  dw_warmup: 1500
  # 用 train-only search 找到的最佳值（trial_0000）
  dw_alpha: 8.94
  loss_l1_w: 0.735
  loss_ssim_w: 0.052
  loss_lpips_w: 0.212
  densify_from: 500
  densify_until: 10000
  densify_interval: 100
  max_gaussians: 2500000
  max_grad: 0.00085
  min_opacity_prune: 0.05
  reset_iters: "3000,8000"