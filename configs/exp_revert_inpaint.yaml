# configs/exp_revert_inpaint.yaml
experiment:
  name: revert_inpaint_test          # ← 新名字，別覆蓋 baseline
  notes: "revert to best inpaint module, train aligned to best"

eval_iggt:
  seed: 33
  n_skip: 40
  inpaint_method: "sd"              # ← 對齊 best（不是 sd）

  # best 版實際會讀的 5 個參數
  src_dilation_px: 11
  tgt_dilation_px: 5
  phot_z_thresh: 3.0
  phot_ring_px: 20
  # use_poisson 在 best 內預設 False，不用設
  # （bilateral / shadow / min_trusted_blob 等 best 版不讀，已移除）

train:                               # ← 全部 = best 的值
  seed: 33
  total_iters: 20000
  dead_weight: 0.3                   # ← 不是 1.0
  patch_size: 256
  dw_warmup: 1500
  dw_alpha: 7.0                      # ← best 值，不是 8.94
  loss_l1_w: 0.70
  loss_ssim_w: 0.15
  loss_lpips_w: 0.15
  densify_from: 500
  densify_until: 12000               # ← best 值，不是 10000
  densify_interval: 100
  max_gaussians: 2500000
  max_grad: 0.0006                   # ← best 值，不是 0.00085
  min_opacity_prune: 0.05
  reset_iters: "3000,8000"
  # dw_dead_scale / lpips_mask_prob 不要設 → 用預設 (1.0 / 0.0)，等同 best 行為