experiment:
  name: golden_467_360
  notes: "360 scene: bg densify scaled to 40k + aggressive dead zone (conservative pull) to remove object residue"
  scene: all
  dataset: spinnerf

eval_iggt:
  seed: 33
  n_skip: 0
  inpaint_method: sd
  src_dilation_px: 15          # ← 11→15：source mask 外扩，pull 时更严格排除物件边缘像素
  tgt_dilation_px: 11          # ← 5→11：dead zone 外扩，把残影边缘纳入 SD 重绘
  phot_z_thresh: 2.0           # ← 3.0→2.0：photometric 信任门槛收紧，污染 pull 被踢进 dead zone
  phot_ring_px: 20
  local_bg_radius: 20
  local_bg_extra_dil: 10
  min_trusted_blob: 800        # ← 300→800：小块孤立 trusted（视差假象）踢进 dead zone
  bilateral_d: 5
  bilateral_sigma: 15.0
  shadow_search_px: 100
  shadow_thresh_k: 100.0       # 保持关闭 shadow 机制（沿用 golden_467）
  min_shadow_blob: 100000
  bright_untrust_k: 100.0      # 保持关闭

train:
  seed: 33
  total_iters: 40000
  dead_weight: 0.3
  patch_size: 256
  dw_warmup: 1500
  dw_alpha: 8.94
  dw_dead_scale: 1.0
  lpips_mask_prob: 0.0
  loss_l1_w: 0.735
  loss_ssim_w: 0.052
  loss_lpips_w: 0.212
  densify_from: 500
  densify_until: 25000          # 背景修复用（已验证有效）
  densify_interval: 100
  max_gaussians: 2500000
  max_grad: 0.0004             # 背景修复用（已验证有效）
  min_opacity_prune: 0.05
  reset_iters: "3000,8000,15000,22000"
  floater_prune_iters: "2500,5500,9000,16000,23000"
  floater_opacity_thresh: 0.15
  floater_scale_pct: 0.99