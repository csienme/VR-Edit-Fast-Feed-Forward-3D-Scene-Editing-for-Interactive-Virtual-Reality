# ============================================================================
# configs/exp_baseline.yaml — grid search 的錨點 (anchor) 設定
# ============================================================================
# 這份 = 你重現出來的 best baseline。grid_search.py 會 deepcopy 它，
# 再用每個 trial 抽到的參數覆蓋對應的 key。所以「沒被搜的 key」全部以這裡為準，
# 務必保持完整。
#
# 一次性 inpainting（run_spinnerf.sh function 1/2/3）也讀這份的 eval_iggt 區塊。
# ============================================================================

experiment:
  name: baseline_v1            # 每個 trial 會被覆蓋成 trial_XXXX，這裡只是預設
  notes: "FID-constrained search anchor (best baseline)"
  scene: all
  dataset: spinnerf

# ============================================================================
# Stage 1 — VGGT + Pull Harvesting (eval_iggt.py)
#   設定成「保住 FID」的版本：多保留真實 RGB、陰影偵測幾乎關閉、平滑很輕。
#   （若你用的是 best inpaint module，shadow/bilateral/min_trusted_blob 是 no-op，留著無害；
#     若你用 v5 module，這些值會讓它不去剝真實 RGB，一樣保 FID。）
# ============================================================================
eval_iggt:
  seed: 33
  n_skip: 40
  inpaint_method: "sd"          # ← 跟你 best 一致

  # Pull harvest geometry
  src_dilation_px: 11
  tgt_dilation_px: 5

  # Photometric（full mode 會搜 phot_z_thresh，train_only 固定在此）
  phot_z_thresh: 3.0            # best 值（不是 2.5）
  phot_ring_px: 20
  local_bg_radius: 20
  local_bg_extra_dil: 10

  # Spatial coherence / smoothing（保 FID：輕平滑、保留更多 pull）
  min_trusted_blob: 300
  bilateral_d: 5
  bilateral_sigma: 15.0

  # Shadow detection（forward-facing 幾乎關閉，避免剝掉真實 RGB → 保 FID）
  shadow_search_px: 100
  shadow_thresh_k: 100.0
  min_shadow_blob: 100000
  bright_untrust_k: 100.0

# ============================================================================
# Stage 2 — 3DGS Training (train.py)  ← 完整列出，未被搜的 key 以此為準
# ============================================================================
train:
  seed: 33
  total_iters: 20000
  patch_size: 256

  # ── 被 grid search 覆蓋的（這裡的值只是錨點/起點）──
  dead_weight: 0.3
  dw_alpha: 7.0
  dw_dead_scale: 1.0
  lpips_mask_prob: 0.0
  loss_l1_w: 0.70
  loss_ssim_w: 0.15
  loss_lpips_w: 0.15
  densify_until: 12000
  max_grad: 0.0006

  # ── 不被搜、固定 ──
  dw_warmup: 1500
  densify_from: 500
  densify_interval: 100
  max_gaussians: 2500000
  min_opacity_prune: 0.05
  reset_iters: "3000,8000"